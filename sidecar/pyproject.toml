[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maskforge-sidecar"
version = "0.1.0"
description = "MaskForge Python sidecar: local HTTP API + raster/mask editing core."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "rasterio>=1.3",
    "numpy>=1.26",
    "shapely>=2.0",
    "pillow>=10.0",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    # Pinned <3: zarr 3.x replaced numcodecs.Blosc(...) compressor objects
    # with a new config-based codec pipeline; pin to the producer's zarr
    # major version so store format assumptions match.
    "zarr>=2.16,<3",
    "xarray>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "httpx>=0.27",
    "pyarrow>=15.0",
]

[tool.setuptools.packages.find]
include = ["maskforge_core*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
