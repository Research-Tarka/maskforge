name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install sidecar dependencies
        working-directory: sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build sidecar (PyInstaller onefile)
        working-directory: sidecar
        run: pyinstaller build_sidecar.spec --noconfirm

      - name: Stage sidecar binary as Tauri external binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp sidecar/dist/maskforge-sidecar.exe src-tauri/binaries/maskforge-sidecar-x86_64-pc-windows-msvc.exe

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maskforge-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
